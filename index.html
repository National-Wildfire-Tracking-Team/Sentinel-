<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Apply the theme before paint to avoid a flash of the wrong one: Light or
      // Dark if picked in the app's menu, else the device's setting (dark when
      // it states none). The parent-domain cookie carries the app's pick to the
      // marketing site; mirrors shared/utils/sharedTheme.js.
      (function () {
        var root = document.documentElement;
        var host = location.hostname;
        if (host.indexOf('app.') !== 0 && host.indexOf('reporter.') !== 0) {
          root.classList.add('site-theme');
        }
        var stored = null;
        try {
          var m = document.cookie.match(/(?:^|; )nwtt-appearance=([^;]*)/);
          stored = m ? m[1] : localStorage.getItem('nwtt-appearance');
        } catch (e) {}
        var light = stored === 'light'
          || (stored !== 'dark' && !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches));
        // Both ways: a prerendered page keeps the class it was saved with.
        root.classList.toggle('dark', !light);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', light ? '#ffffff' : '#0a0c0e');
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sentinel-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="National Wildfire Tracking Team – Real-time wildfire tracking, weather alerts, and fire intelligence across the United States." />
    <meta name="theme-color" content="#0a0c0e" />

    <!-- Open Graph -->
    <meta property="og:title" content="National Wildfire Tracking Team – NWTT" />
    <meta property="og:description" content="Real-time wildfire tracking platform with live fire hotspots, perimeters, weather alerts, and air quality data." />
    <meta property="og:type" content="website" />

    <!-- Text uses the device's system fonts (tailwind.config.js), so there is
         no webfont to fetch before the first paint. -->
    <link rel="dns-prefetch" href="https://api.mapbox.com" />
    <link rel="dns-prefetch" href="https://events.mapbox.com" />
    <link rel="dns-prefetch" href="https://firms.modaps.eosdis.nasa.gov" />

    <title>National Wildfire Tracking Team – NWTT</title>
  </head>
  <body class="bg-sentinel-900 text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
