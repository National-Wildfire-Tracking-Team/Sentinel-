name: MRMS Composite Radar Sync

# Kept fully separate from nexrad-radar-sync.yml: independent source,
# independent decoder toolchain, independent Supabase storage — the two
# radar pipelines are permanently independent by design.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/2 * * * *"

# MRMS publishes a new composite file roughly every 2 minutes (see
# scripts/mrms-radar-sync.mjs's module doc), so this cadence already matches
# upstream freshness — not changed. Guards against a run that occasionally
# runs long overlapping the next scheduled tick; queues rather than cancels
# so an in-flight Supabase Storage/table write is never interrupted mid-way.
concurrency:
  group: mrms-radar-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify required secrets exist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)

      # scripts/mrms-radar-sync.mjs imports only Node built-ins (child_process,
      # fs, os, path, zlib) plus src/app/utils/mrmsPayloadFormat.js, which
      # itself has zero imports — no npm package is ever required, so `npm ci`
      # (previously run here every 2 minutes) was pure overhead and is removed.
      # Do not reintroduce it unless this script starts importing a package.

      # Pinned exact version+build so a future conda-forge update can't
      # silently change GRIB2 decoding behavior underneath this workflow.
      # cache-environment/cache-downloads restore the previously-built
      # environment from the GitHub Actions cache on every run after the
      # first (keyed on the pinned spec above), skipping the conda-forge
      # solve/install that otherwise dominates this job's runtime — with no
      # change to the exact wgrib2 build actually installed.
      - name: Set up pinned wgrib2 (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: mrms-decode
          create-args: >-
            wgrib2=3.8.0=h021f410_7
          channels: conda-forge
          cache-environment: true
          cache-downloads: true

      - name: Run MRMS radar sync
        # setup-micromamba activates the environment via shell profile hooks,
        # which only login shells pick up — this is that action's documented
        # usage pattern for any step that needs the pinned tool on PATH.
        shell: bash -el {0}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          wgrib2 -version || true
          node scripts/mrms-radar-sync.mjs
