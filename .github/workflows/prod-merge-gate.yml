name: Prod → Main Merge Gate

on:
  pull_request:
    # Repo's production/default branch is "Main" (capital M, confirmed via
    # `gh repo view --json defaultBranchRef` and the existing branch list —
    # there is no lowercase "main" branch). This previously read "main", so
    # this gate's condition never matched a real PR and the job never ran.
    branches:
      - Main
    types: [opened, synchronize, reopened]

concurrency:
  group: prod-merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Only allow PRs from prod branch
    if: github.event.pull_request.head.ref == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm run test:coverage

      - name: Verify build output exists
        run: |
          if [ ! -d "dist" ]; then
            echo "Build output directory 'dist' not found"
            exit 1
          fi
