name: CI

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=200
      - run: npm run build
      # test:coverage runs the full `vitest run` suite with coverage
      # instrumentation enabled, so it supersedes a plain `npm run test` —
      # running both would execute the same tests twice.
      - run: npm run test:coverage

  e2e:
    # Its own job so Main's ruleset can require E2E by name on every PR.
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  weather-models:
    name: Weather Models service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud/weather-models
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # Offline: the tests build synthetic Icechunk datasets in memory and
      # never read the real HRRR/GFS buckets.
      - run: uv run --python 3.13 --with-requirements requirements-dev.txt pytest

  fire-danger:
    name: Fire danger service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud/fire-danger
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # Offline: the tests replay recorded FEMS responses and never call FEMS.
      - run: uv run --python 3.13 --with-requirements requirements-dev.txt pytest

  mrms:
    name: MRMS service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud/mrms
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # Offline: the tests write synthetic MRMS GRIB2 files and never read NOAA's buckets.
      - run: uv run --python 3.13 --with-requirements requirements-dev.txt pytest

  hafs:
    name: HAFS service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud/hafs
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # Offline: synthetic HAFS GRIB2 messages and a stand-in for NOAA's bucket.
      - run: uv run --python 3.13 --with-requirements requirements-dev.txt pytest

  infra:
    name: AWS infrastructure (CDK synth + assertions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/aws/package-lock.json
      - run: npm ci
      - run: npm test
