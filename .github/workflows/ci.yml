name: CI

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=200
      - run: npm run build
      # test:coverage runs the full `vitest run` suite with coverage
      # instrumentation enabled, so it supersedes a plain `npm run test` —
      # running both would execute the same tests twice.
      - run: npm run test:coverage
      - name: Determine if E2E should run
        id: e2e-gate
        run: echo "run=${{ github.event.pull_request.base.ref == 'Main' || github.event.pull_request.base.ref == 'stage' || github.event.pull_request.base.ref == 'dev' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        if: steps.e2e-gate.outputs.run == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
        if: steps.e2e-gate.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npm run test:e2e
        if: steps.e2e-gate.outputs.run == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.e2e-gate.outputs.run == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  weather-models:
    name: Weather Models service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud/weather-models
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Offline: the tests build synthetic Icechunk datasets in memory and
      # never read the real HRRR/GFS buckets.
      - run: uv run --python 3.13 --with-requirements requirements-dev.txt pytest

  infra:
    name: AWS infrastructure (CDK synth + assertions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/aws/package-lock.json
      - run: npm ci
      - run: npm test
