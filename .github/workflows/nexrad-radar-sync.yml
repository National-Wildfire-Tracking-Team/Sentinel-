name: NEXRAD Radar Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/2 * * * *"

# New NEXRAD volumes land every 3-8 minutes per site (see scripts/nexrad-
# radar-sync.mjs's module doc), but sites scan on independent, staggered
# schedules and the script already exits immediately when no site has been
# viewed recently (see fetchActiveSites/"nothing to do" in the script) — so
# the 2-minute cadence is what keeps whichever site a user currently has open
# fresh, and is left unchanged rather than traded for Actions-minute savings.
concurrency:
  group: nexrad-radar-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify required secrets exist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)

      # This script imports 'nexrad-level-2-data' and 'fast-xml-parser' (real
      # npm packages), so npm ci is genuinely required here — unlike mrms-
      # radar-sync.yml. `cache: npm` above speeds up the install by reusing
      # the npm download cache instead of hitting the registry cold every run.
      - name: Install dependencies
        run: npm ci

      - name: Run NEXRAD radar sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/nexrad-radar-sync.mjs
