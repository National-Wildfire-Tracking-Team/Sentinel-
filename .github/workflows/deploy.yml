name: Deploy

on:
  push:
    branches: [Main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
      # Snapshot the marketing pages as static HTML for crawlers (see
      # scripts/prerender.mjs). Deliberately run here rather than as part of
      # `npm run build` itself, so netlify.toml's own build command (used
      # for deploy-preview/branch-deploy contexts) is unaffected.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npm run prerender
      # Deploy with the Netlify CLI (not a raw folder upload) so netlify.toml's
      # redirects/headers and the netlify/edge-functions/ directory actually get
      # processed — a plain publish-dir upload skips both, which is why prior
      # deploys done this way logged "No redirect rules processed" and "No edge
      # functions deployed" and never correctly served the tracker app.
      - run: npx --yes netlify-cli deploy --no-build --dir=dist --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Deploy ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
