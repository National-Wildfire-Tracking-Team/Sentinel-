name: Deploy

on:
  push:
    branches: [Main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          # FEMA Flood Hazard layer proxy — see cloud/fema-nfhl-proxy/README.md.
          VITE_FEMA_NFHL_PROXY_URL: ${{ secrets.VITE_FEMA_NFHL_PROXY_URL }}
          # Cloud Run data proxies for the Land Ownership layer and the CAL FIRE
          # FRAP historical-perimeter fallback. Each client falls back to its
          # original direct fetch when its URL is unset — see
          # cloud/california-land-ownership-proxy/README.md and
          # cloud/calfire-frap-proxy/README.md.
          VITE_CALIFORNIA_LAND_OWNERSHIP_PROXY_URL: ${{ secrets.VITE_CALIFORNIA_LAND_OWNERSHIP_PROXY_URL }}
          VITE_CALFIRE_FRAP_PROXY_URL: ${{ secrets.VITE_CALFIRE_FRAP_PROXY_URL }}
          # Server-side active-fire perimeter merge — see
          # cloud/fire-perimeters-merge/README.md. Unset the secret to fall
          # back to the original per-client fetch+merge, no code change needed.
          VITE_FIRE_MERGE_SERVICE_URL: ${{ secrets.VITE_FIRE_MERGE_SERVICE_URL }}
          # Shared NWS alerts snapshot — see cloud/nws-alerts/README.md.
          # Unset the secret to fall back to the per-tab Netlify path
          # (/api/wx + /api/nws/wwa), no code change needed.
          VITE_NWS_ALERTS_SERVICE_URL: ${{ secrets.VITE_NWS_ALERTS_SERVICE_URL }}
          # HRRR/GFS model forecasts for the live map's Models tab — see
          # cloud/weather-models/README.md. Unset: the tab explains the
          # service isn't configured; nothing else in the app changes.
          VITE_WEATHER_MODEL_SERVICE_URL: ${{ secrets.VITE_WEATHER_MODEL_SERVICE_URL }}
          VITE_MRMS_URL: ${{ secrets.VITE_MRMS_URL }}
      # Snapshot the marketing pages as static HTML for crawlers (see
      # scripts/prerender.mjs). Deliberately run here rather than as part of
      # `npm run build` itself, so netlify.toml's own build command (used
      # for deploy-preview/branch-deploy contexts) is unaffected.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npm run prerender
      # Deploy with the Netlify CLI (not a raw folder upload) so netlify.toml's
      # redirects/headers and the netlify/edge-functions/ directory actually get
      # processed — a plain publish-dir upload skips both, which is why prior
      # deploys done this way logged "No redirect rules processed" and "No edge
      # functions deployed" and never correctly served the tracker app.
      - run: npx --yes netlify-cli deploy --no-build --dir=dist --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Deploy ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
