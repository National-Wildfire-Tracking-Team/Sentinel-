name: Deploy

on:
  push:
    branches: [Main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          # NEXRAD radar pipeline (Firestore + Cloud Storage + the
          # nexrad-heartbeat Cloud Run service) — see .env.example and
          # cloud/nexrad-sync/README.md / cloud/nexrad-heartbeat/README.md.
          # All five VITE_FIREBASE_* values are public (same publicity level
          # as the Supabase URL/anon key above), not secrets in the security
          # sense — stored as repo secrets here only because that's this
          # workflow's existing mechanism for build-time env vars.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_NEXRAD_HEARTBEAT_URL: ${{ secrets.VITE_NEXRAD_HEARTBEAT_URL }}
          # FEMA Flood Hazard layer proxy — see cloud/fema-nfhl-proxy/README.md.
          VITE_FEMA_NFHL_PROXY_URL: ${{ secrets.VITE_FEMA_NFHL_PROXY_URL }}
      # Snapshot the marketing pages as static HTML for crawlers (see
      # scripts/prerender.mjs). Deliberately run here rather than as part of
      # `npm run build` itself, so netlify.toml's own build command (used
      # for deploy-preview/branch-deploy contexts) is unaffected.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npm run prerender
      # Deploy with the Netlify CLI (not a raw folder upload) so netlify.toml's
      # redirects/headers and the netlify/edge-functions/ directory actually get
      # processed — a plain publish-dir upload skips both, which is why prior
      # deploys done this way logged "No redirect rules processed" and "No edge
      # functions deployed" and never correctly served the tracker app.
      - run: npx --yes netlify-cli deploy --no-build --dir=dist --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Deploy ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
