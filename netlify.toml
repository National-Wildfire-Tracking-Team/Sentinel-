[build]
  command = "npm run build"
  publish = "dist"

# Proxy Mapbox API requests to avoid CORS issues on deploy previews
[[redirects]]
  from = "/api/mapbox/*"
  to = "https://api.mapbox.com/:splat"
  status = 200
  force = true

# Proxy NASA FIRMS API via edge function to avoid CORS issues on deploy previews
[[edge_functions]]
  function = "firms-proxy"
  path = "/api/firms/*"

# Proxy NOAA NOMADS WMS through edge function to avoid browser CORS failures
[[edge_functions]]
  function = "noaa-wms-proxy"
  path = "/api/noaa-wms/*"

# SPA fallback – must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
