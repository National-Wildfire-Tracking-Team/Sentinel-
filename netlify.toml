[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Production branch
[context.production]
  branch = "Main"

# Stage branch preview deployment
[context.deploy-preview]
  branch = "stage"

# Dev branch deployment
[context.branch-deploy]
  branch = "dev"

# Vite-hashed assets (JS/CSS chunks) are content-addressed — the filename
# changes whenever the contents do — so they're safe to cache forever.
# Without this, browsers re-fetch the ~2MB+ JS bundle on every visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Proxy Mapbox API requests
[[redirects]]
  from = "/api/mapbox/*"
  to = "https://api.mapbox.com/:splat"
  status = 200
  force = true

# Edge functions
[[edge_functions]]
  function = "firms-proxy"
  path = "/api/firms/*"

[[edge_functions]]
  function = "fema-proxy"
  path = "/api/fema"

[[edge_functions]]
  function = "calfire-proxy"
  path = "/api/calfire"

[[edge_functions]]
  function = "census-counties-proxy"
  path = "/api/census/counties"

[[edge_functions]]
  function = "nwps-proxy"
  path = "/api/nwps/*"

[[edge_functions]]
  function = "river-gauges-proxy"
  path = "/api/river-gauges"

[[edge_functions]]
  function = "river-gauges-forecast-proxy"
  path = "/api/river-gauges-forecast"

[[edge_functions]]
  function = "noaa-proxy"
  path = "/api/noaa/*"

# Layer-data proxies, grouped by upstream provider. These put the non-live
# map layers behind the CDN instead of having every browser hit the upstream
# ArcGIS/NOAA services directly — see netlify/edge-functions/_shared/edgeProxy.js
# for the cache tiers and the freshness guarantees they carry.
#
# `cache = "manual"` is what makes Netlify honour the Netlify-CDN-Cache-Control
# headers edgeProxy.js sets. Without it, edge function responses are never
# cached: every request runs the function and hits the upstream, whatever the
# headers say. Only the createProxy-based functions below get it; the proxies
# above aren't built on edgeProxy.js and are deliberately left as they were.
[[edge_functions]]
  function = "nws-mapservices-proxy"
  path = "/api/nws/*"
  cache = "manual"

[[edge_functions]]
  function = "arcgis-proxy"
  path = "/api/arcgis/*"
  cache = "manual"

[[edge_functions]]
  function = "weather-gov-proxy"
  path = "/api/wx/*"
  cache = "manual"

[[edge_functions]]
  function = "airnow-edge-proxy"
  path = "/api/airnow/*"
  cache = "manual"

[[edge_functions]]
  function = "nesdis-proxy"
  path = "/api/nesdis/*"
  cache = "manual"

[[edge_functions]]
  function = "nationalmap-proxy"
  path = "/api/natmap/*"
  cache = "manual"

# Backward-compat for old bookmarks/links to the tracker's old path.
# The tracker now lives at the root of app.nationalwildfiretrackingteam.org
# instead of "/sentinel" on the main domain — routing between the marketing
# site and the app is now handled by hostname in src/main.jsx, not by
# a path redirect here.
[[redirects]]
  from = "/sentinel"
  to = "https://app.nationalwildfiretrackingteam.org/"
  status = 301
  force = true

# A missing hashed asset (a tab still running an older deploy asks for a chunk
# that no longer exists) must 404, not fall through to the SPA fallback below.
# Otherwise index.html is returned as the "JS" — the browser rejects it with a
# text/html MIME error — and, because of the /assets/* header above, it's
# cached as immutable for a year under that chunk's URL. Not forced, so real
# files are still served normally.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# SPA fallback – must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
